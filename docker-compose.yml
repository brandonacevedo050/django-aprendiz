# ============================================================
# Este archivo va en la RAÍZ del proyecto (un nivel arriba de
# django_aprendiz/ y de front_adso-main/), no dentro de django_aprendiz/.
# ============================================================
services:

  mysql:
    image: mysql:8.0
    container_name: mysql_django
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aprendiz

    ports:
      # host:contenedor -> desde tu máquina (DataGrip, Django local)
      # te conectas por el 3307. Entre contenedores (backend -> mysql)
      # se usa el 3306 interno, no este mapeo.
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./django_aprendiz/Mysql-init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build: ./django_aprendiz
    container_name: backend_django
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_ENGINE: mysql
      DB_HOST: mysql       # nombre del servicio, no localhost
      DB_PORT: 3306        # puerto INTERNO de la red de Docker
      DB_NAME: aprendiz
      DB_USER: root
      DB_PASSWORD: root

      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_ALLOWED_HOSTS: "*"

      CORS_ALLOWED_ORIGINS: http://localhost:5173

    ports:
      - "8080:8080"


  frontend:
    build: ./front_adso-main/front_adso-main
    container_name: frontend_django
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:80"


volumes:
  mysql_data:
